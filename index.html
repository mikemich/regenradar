<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RegenRadar</title>
<meta name="theme-color" content="#0b5fff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>🌧️ RegenRadar</h1>
  <form id="search"><input id="q" placeholder="Search city…" autocomplete="off"><button>Go</button><button type="button" id="locate" title="Use my location">📍</button></form>
</header>
<main>
  <section class="card hero">
    <div id="place" class="muted"></div>
    <div id="summary">Loading…</div>
    <div id="now" class="muted"></div>
  </section>
  <section class="card">
    <h2>Rain next 2 hours <span class="muted">(mm/h)</span></h2>
    <div id="bars" class="bars"></div>
    <div id="barlabels" class="barlabels"></div>
  </section>
  <section class="card">
    <h2>Radar</h2>
    <div id="map"></div>
    <div class="controls"><button id="play">⏸</button><input id="slider" type="range" min="0" value="0"><span id="ts" class="muted"></span></div>
  </section>
  <section class="card"><h2>Next 24 hours</h2><div id="hourly" class="strip"></div></section>
  <section class="card"><h2>7 days</h2><div id="daily"></div></section>
  <section class="card">
    <h2>Notifications</h2>
    <label><input type="checkbox" id="notifOn"> Alert me before rain starts</label>
    <label>Min. intensity <select id="thr"><option value="0.1">Drizzle (0.1)</option><option value="0.5" selected>Light (0.5)</option><option value="2.5">Moderate (2.5)</option></select> mm/h</label>
    <label>Lead time <select id="lead"><option>10</option><option selected>20</option><option>30</option><option>45</option></select> min</label>
    <p class="muted small">Alerts fire while the app is open or running in the background. For always-on alerts, use the free ntfy setup in the README.</p>
  </section>
  <footer class="muted small">Data: <a href="https://open-meteo.com">Open-Meteo</a> · <a href="https://www.rainviewer.com">RainViewer</a> · © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · MIT licensed</footer>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
