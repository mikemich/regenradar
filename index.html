<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RegenRadar</title>
<meta name="theme-color" content="#1c3d6e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RegenRadar">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="clear-day">
<div class="bar">
  <button id="cityBtn" class="pill"><span id="place">—</span></button>
  <button id="bellBtn" class="pill round" aria-label="Notifications">🔔</button>
</div>
<main>
  <section class="hero">
    <div id="temp">--°</div>
    <div id="cond" class="soft"></div>
    <div id="summary">Loading…</div>
  </section>

  <section class="card">
    <div class="label">Next 2 hours</div>
    <div id="bars" class="bars"></div>
    <div id="barlabels" class="barlabels"></div>
  </section>

  <section class="card flush">
    <div class="label pad">Radar</div>
    <div class="mapwrap"><div id="map"></div><button id="play" class="pill round">⏸</button><span id="ts" class="pill tag"></span></div>
    <input id="slider" type="range" min="0" value="0">
  </section>

  <section class="card">
    <div class="label">Today</div>
    <div id="hourly" class="strip"></div>
  </section>

  <section class="card">
    <div class="label">7 days</div>
    <div id="daily"></div>
  </section>

  <footer>Open-Meteo · RainViewer · OpenStreetMap</footer>
</main>

<div id="scrim"></div>
<div id="citySheet" class="sheet">
  <div class="grab"></div>
  <form id="search"><input id="q" placeholder="Search city" autocomplete="off"></form>
  <button id="locate" class="row">📍 Use my location</button>
</div>
<div id="bellSheet" class="sheet">
  <div class="grab"></div>
  <h3>Rain alerts</h3>
  <label class="row">Notify me before rain <input type="checkbox" id="notifOn" class="switch"></label>
  <label class="row">Intensity <select id="thr"><option value="0.1">Drizzle</option><option value="0.5">Light</option><option value="2.5">Moderate</option></select></label>
  <label class="row">Lead time <select id="lead"><option value="10">10 min</option><option value="20">20 min</option><option value="30">30 min</option><option value="45">45 min</option></select></label>
  <p class="soft small">Alerts work while the app is open or in the background.</p>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
