name: rain-alert
on:
  schedule: [{cron: '*/10 * * * *'}]
  workflow_dispatch:
jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node scripts/notify.mjs
        env:
          LAT: ${{ vars.LAT }}
          LON: ${{ vars.LON }}
          TOPIC: ${{ secrets.NTFY_TOPIC }}
